<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Предпросмотр профиля</title>
<base href="/nullreferenceenjoyer/" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css" />
<style>
  body { background: #0d1117; margin: 0; padding: 24px 16px; }
  .markdown-body { max-width: 846px; margin: 0 auto; }
</style>
</head>
<body>
<article class="markdown-body" id="out"></article>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  fetch('README.md').then(r => r.text()).then(t => { document.getElementById('out').innerHTML = marked.parse(t); });
</script>
</body>
</html>
