<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="see you in the commits">
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#f7768e"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="150" rx="22"/></clipPath>
    <style>
      text { font-family: 'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'DejaVu Sans Mono',monospace; }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="150" fill="#1a1b26"/>
    <text x="600" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#c0caf5">see you in the commits</text>
    <text x="600" y="78" text-anchor="middle" font-size="14" fill="#565f89">if (you == null) throw new ComeBackLaterException();</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-600,0" dur="14s" repeatCount="indefinite"/>
      <path d="M0,118 Q150,92 300,118 T600,118 T900,118 T1200,118 T1500,118 T1800,118 V150 H0Z" fill="url(#w1)" opacity=".35"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-600,0;0,0" dur="10s" repeatCount="indefinite"/>
      <path d="M0,128 Q150,108 300,128 T600,128 T900,128 T1200,128 T1500,128 T1800,128 V150 H0Z" fill="url(#w1)" opacity=".6"/>
    </g>
  </g>
</svg>
